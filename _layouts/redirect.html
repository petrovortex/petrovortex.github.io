layout: default

{% assign t = site.data.ui[page.lang] %}
<h1>{{ t.redirect }}</h1><p><a class="text-link" href="{{ page.redirect_to | relative_url }}">{{ t.continue }} →</a></p>
<script>location.replace({{ page.redirect_to | relative_url | jsonify }} + location.search + location.hash);</script>
