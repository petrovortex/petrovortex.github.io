{% if page.image and page.image != '' %}<figure class="article-cover{% if page.image_dark %} themed-art{% endif %}"><img class="main-post-image{% if page.image_dark %} art-light{% endif %}" src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: page.title | escape }}">{% if page.image_dark %}<img class="main-post-image art-dark" src="{{ page.image_dark | relative_url }}" alt="{{ page.image_alt | default: page.title | escape }}">{% endif %}{% if page.image_caption %}<figcaption>{{ page.image_caption }}</figcaption>{% endif %}</figure>{% endif %}
