{% macro coverImage(image, dark, alt, caption) %}
{% if image %}<figure class="article-cover{% if dark %} themed-art{% endif %}"><img class="main-post-image{% if dark %} art-light{% endif %}" src="{{ image | relativeUrl }}" alt="{{ alt }}">{% if dark %}<img class="main-post-image art-dark" src="{{ dark | relativeUrl }}" alt="{{ alt }}">{% endif %}{% if caption %}<figcaption>{{ caption }}</figcaption>{% endif %}</figure>{% endif %}
{% endmacro %}
