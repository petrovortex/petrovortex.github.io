{% from "components/icon.html" import icon %}
{% macro engagement(id, url, title, t, compact=false) %}
<div class="engagement{% if compact %} engagement-compact{% endif %}" data-stats-id="{{ id }}">
  {% if not compact %}<span class="view-label" title="{{ t.views }}">{{ icon('eye') }}<span class="sr-only">{{ t.views }}: </span><span data-count="views">—</span></span>{% endif %}
  <button class="like-button" type="button" data-like aria-pressed="false" aria-label="{{ t.like }}" disabled>{{ icon('heart') }}<span data-count="likes">—</span></button>
  {% if not compact %}<details class="share-menu">
    <summary aria-label="{{ t.share }}">{{ icon('share') }}<span>{{ t.share }}</span></summary>
    <div class="share-options" data-share-url="{{ url | absoluteUrl }}" data-share-title="{{ title }}">
      <button type="button" data-share="copy">{{ t.copy }}</button>
      <a href="https://x.com/intent/tweet?url={{ url | absoluteUrl | urlencode }}&amp;text={{ title | urlencode }}" target="_blank" rel="noopener noreferrer">X / Twitter ↗</a>
      <a href="https://t.me/share/url?url={{ url | absoluteUrl | urlencode }}&amp;text={{ title | urlencode }}" target="_blank" rel="noopener noreferrer">Telegram ↗</a>
      <button type="button" data-share="discord">{{ t.discord }}</button>
      <a href="mailto:?subject={{ title | urlencode }}&amp;body={{ url | absoluteUrl | urlencode }}" target="_blank" rel="noopener noreferrer">{{ t.email }}</a>
    </div>
  </details>{% endif %}
</div>
{% endmacro %}
