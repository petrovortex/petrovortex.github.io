{% macro previewImage(item) %}
{% set preview = item.preview_image or item.image %}
{% set dark = item.preview_image_dark if item.preview_image else item.image_dark %}
{% if preview %}<span class="preview-art{% if dark %} themed-art{% endif %}"><img {% if dark %}class="art-light"{% endif %} src="{{ preview | relativeUrl }}" alt="" width="360" height="240" loading="lazy" decoding="async">{% if dark %}<img class="art-dark" src="{{ dark | relativeUrl }}" alt="" width="360" height="240" loading="lazy" decoding="async">{% endif %}</span>{% endif %}
{% endmacro %}
