{% macro notebookStatus(notebook, t) %}
{% set status = notebook.status or 'in_progress' %}<span class="notebook-status status-{{ status }}" title="{{ t.notebook_complete_hint if status == 'complete' else t.notebook_progress_hint }}"><span aria-hidden="true"></span>{{ t.notebook_complete if status == 'complete' else t.notebook_progress }}</span>
{% endmacro %}
