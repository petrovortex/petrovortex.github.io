{% macro courseStatus(course, t) %}
{% set status = course.status or 'in_progress' %}<span class="course-status status-{{ status }}" title="{{ t.course_complete_hint if status == 'complete' else t.course_progress_hint }}"><span aria-hidden="true"></span>{{ t.course_complete if status == 'complete' else t.course_progress }}</span>
{% endmacro %}
